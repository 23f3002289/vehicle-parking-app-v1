{% extends "base.html" %}

{% block title %}Create Parking Lot{% endblock %}

{% block content %}
<h2 class="mb-4 text-primary">Create Parking Lot</h2>

<form method="post" class="bg-white p-4 rounded shadow-sm border">
    <div class="mb-3">
        <label class="form-label">Lot Name</label>
        <input name="lot_name" class="form-control" placeholder="e.g. Park Parking" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Location</label>
        <input name="location" class="form-control" placeholder="e.g. Sector V, Chennai" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Price per Hour (₹)</label>
        <input name="price_per_hour" type="number" step="0.01" class="form-control" placeholder="e.g. 30" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Full Address</label>
        <input name="address" class="form-control" placeholder="e.g. 15A, Sector V,Chennai" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Pincode</label>
        <input name="pincode" class="form-control" placeholder="e.g. 700091" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Maximum Spots</label>
        <input name="max_spots" type="number" class="form-control" placeholder="e.g. 10" required>
    </div>

    <button type="submit" class="btn btn-success">Create Lot</button>
    <a href="/admin/dashboard" class="btn btn-secondary ms-2">← Back to Dashboard</a>
</form>

{% endblock %}
